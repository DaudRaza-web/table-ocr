<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table OCR</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --ink: #1d2330; --muted: #6b7280; --line: #dde1e7;
    --accent: #2563eb; --accent-ink: #fff; --sel: rgba(37,99,235,.18); --head: #e8eefc; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181d; --panel: #1e2229; --ink: #e6e8ec; --muted: #9aa3af; --line: #343a44;
            --accent: #4f8bff; --sel: rgba(79,139,255,.22); --head: #26324a; --danger: #ff6b5b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  button, select, input[type=text] { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 13px; }
  #status.err { color: var(--danger); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px; min-height: 0; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  #viewer { flex: 1; overflow: auto; padding: 12px; background: var(--bg); }
  #stage { position: relative; margin: 0 auto; width: fit-content; user-select: none; cursor: crosshair; touch-action: none; }
  #stage img { display: block; box-shadow: 0 1px 6px rgba(0,0,0,.2); background: #fff; }
  #selbox { position: absolute; border: 2px solid var(--accent); background: var(--sel); display: none; pointer-events: none; }
  #empty { color: var(--muted); text-align: center; margin-top: 15vh; }
  #drop.over { outline: 3px dashed var(--accent); outline-offset: -8px; }
  #tableWrap { flex: 1; overflow: auto; padding: 12px; }
  #title { width: 100%; font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 10px; }
  table { border-collapse: collapse; min-width: 100%; }
  td { border: 1px solid var(--line); padding: 4px 6px; min-width: 60px; vertical-align: top; white-space: pre-wrap; outline: none; }
  td:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  tr.head td { background: var(--head); font-weight: 600; text-align: center; }
  td.rn { background: var(--bg); color: var(--muted); font-size: 11px; text-align: right; min-width: 28px; width: 28px; user-select: none; }
  td.cur { background: var(--sel); }
  .hint { color: var(--muted); font-size: 12px; padding: 0 10px 8px; }
  #spinner { display: none; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tabs { display: flex; gap: 2px; background: var(--bg); padding: 3px; border-radius: 8px; border: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; padding: 5px 12px; }
  .tabs button.active { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); font-weight: 400; }
  .tx { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px; min-height: 0; }
  .tx > label, .tx .row label { font-weight: 600; }
  .tx .row { display: flex; gap: 8px; align-items: center; }
  textarea { flex: 1; min-height: 140px; width: 100%; resize: vertical; font: 15px/1.6 system-ui, "Segoe UI", sans-serif; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  textarea.rtl { font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", "Segoe UI", system-ui, sans-serif; font-size: 20px; line-height: 2; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-auto-rows: minmax(420px, auto); } body { height: auto; } }
</style>
</head>
<body>
<header>
  <h1>Table OCR</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="table" class="active">Table → Excel</button>
    <button role="tab" data-tab="translate">Translate</button>
  </nav>
  <button class="primary" id="openBtn">Open image / PDF</button>
  <input type="file" id="file" accept=".pdf,image/*" hidden>
  <span id="fname" style="color:var(--muted)"></span>
  <span class="spacer"></span>
  <label style="color:var(--muted)" class="for-table">Model <select id="model"></select></label>
  <label style="color:var(--muted)" class="for-translate" hidden>Model <select id="tModel"></select></label>
  <span id="spinner"></span>
  <span id="status">Starting…</span>
</header>

<main>
  <section class="pane" id="drop">
    <div class="bar">
      <button id="prev" disabled>&larr; Prev</button>
      <span>Page <input type="text" id="pageNo" value="0" style="width:3.5em;text-align:center"> / <span id="pageCount">0</span></span>
      <button id="next" disabled>Next &rarr;</button>
      <span class="spacer"></span>
      <button id="zoomOut" title="Zoom out">−</button>
      <span id="zoomLbl">100%</span>
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="fit">Fit</button>
    </div>
    <div class="bar">
      <button class="primary for-table" id="extract" disabled>Extract table</button>
      <label class="for-table"><input type="radio" name="mode" value="replace" checked> Replace</label>
      <label class="for-table" title="Add rows to the current table (e.g. a table that continues on the next page)"><input type="radio" name="mode" value="append"> Append rows</label>
      <button class="primary for-translate" id="translateSel" disabled hidden>Translate selection</button>
      <label class="for-translate" hidden title="Add each translated selection below the previous one"><input type="checkbox" id="appendOut" checked> Add to output</label>
      <button id="clearSel" disabled>Clear selection</button>
    </div>
    <div class="hint for-table">Drag over the page to select the table region.</div>
    <div class="hint for-translate" hidden>Drag over the page to select text. It is transcribed into “Original text” (fix any errors there), then translated. A paragraph or column at a time works best.</div>
    <div id="viewer">
      <div id="empty">Open or drop an image / PDF to begin.</div>
      <div id="stage" hidden><img id="pageImg" alt="page" draggable="false"><div id="selbox"></div></div>
    </div>
  </section>

  <section class="pane for-translate" id="translatePane" hidden>
    <div class="bar">
      <label>From <select id="srcLang">
        <option value="auto">Auto-detect</option>
        <option value="ur">Urdu</option>
        <option value="pa-Arab">Punjabi (Shahmukhi)</option>
        <option value="pa-Guru">Punjabi (Gurmukhi)</option>
        <option value="sd-Arab">Sindhi</option>
      </select></label>
      <label>To <select id="tgtLang">
        <option value="en">English</option>
        <option value="ur">Urdu</option>
      </select></label>
      <span class="spacer"></span>
      <button class="primary" id="translateText">Translate text</button>
    </div>
    <div class="tx">
      <label for="srcText">Original text <span class="muted">— type or paste, or select a region on the page instead</span></label>
      <textarea id="srcText" dir="auto" class="rtl" placeholder="یہاں اردو، پنجابی یا سندھی متن لکھیں یا چسپاں کریں…"></textarea>
      <div class="row">
        <label for="outText">Translation <span class="muted">— editable</span></label>
        <span class="spacer"></span>
        <button id="clearOut">Clear</button>
        <button id="copyOut">Copy</button>
        <button id="saveOut">Download .txt</button>
      </div>
      <textarea id="outText" dir="auto" placeholder="The translation appears here."></textarea>
    </div>
  </section>

  <section class="pane for-table" id="tablePane">
    <div class="bar">
      <button id="addRow" title="Insert row below the selected cell">+ Row</button>
      <button id="delRow">− Row</button>
      <button id="addCol" title="Insert column right of the selected cell">+ Col</button>
      <button id="delCol">− Col</button>
      <label><input type="checkbox" id="hasHeader" checked> First row is header</label>
      <span class="spacer"></span>
      <button id="copy" title="Copy as tab-separated text (pastes into Excel)">Copy</button>
      <button class="primary" id="export">Download .xlsx</button>
    </div>
    <div id="tableWrap">
      <input type="text" id="title" placeholder="Table title (optional)">
      <table id="grid"></table>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const state = { doc: null, pages: 0, page: 0, zoom: 1, natW: 0, sel: null, rows: [], cur: [0, 0], busy: false, tab: 'table' };

function status(msg, err = false) { const s = $('#status'); s.textContent = msg; s.classList.toggle('err', err); }
function busy(on) { state.busy = on; $('#spinner').style.display = on ? 'inline-block' : 'none'; refreshButtons(); }
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const ct = r.headers.get('Content-Type') || '';
  if (!ct.includes('json')) { if (!r.ok) throw new Error(r.statusText); return r; }
  const j = await r.json();
  if (!r.ok || j.error && j.ok !== false) throw new Error(j.error || r.statusText);
  return j;
}

/* ---------- models ---------- */
async function loadModels() {
  const j = await api('/api/models');
  const sel = $('#model'), prev = sel.value; sel.innerHTML = '';
  const vision = j.models.filter(m => /vl|vision|llava|minicpm|gemma3|moondream|granite.*vision|qwen3-vl|mistral-small3/i.test(m));
  const list = vision.length ? vision : j.models;
  list.forEach(m => sel.add(new Option(m, m)));
  if (list.includes(prev)) sel.value = prev; else if (list.includes(j.default)) sel.value = j.default;

  const tSel = $('#tModel'), tPrev = tSel.value; tSel.innerHTML = '';
  const tList = j.models.filter(m => !/embed/i.test(m));
  tList.forEach(m => tSel.add(new Option(m, m)));
  const tHas = tList.includes(j.translate_default);
  if (tList.includes(tPrev)) tSel.value = tPrev; else if (tHas) tSel.value = j.translate_default;

  const missing = !j.ok ? j.error
    : !vision.length ? 'No vision model found — run in WSL: ollama pull ' + j.default
    : !tHas ? 'Translation model missing — run in WSL: ollama pull ' + j.translate_default : '';
  if (!missing) { if (!state.doc) status('Ready — Ollama connected'); return; }
  status(missing, true);
  setTimeout(() => loadModels().catch(() => {}), 10000);  // keep checking until the models are available
}

/* ---------- tabs ---------- */
function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.for-table').forEach(el => el.hidden = tab !== 'table');
  document.querySelectorAll('.for-translate').forEach(el => el.hidden = tab !== 'translate');
  try { localStorage.setItem('tab', tab); } catch {}
  refreshButtons();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

/* ---------- document / pages ---------- */
async function openFile(f) {
  if (!f) return;
  busy(true); status('Opening ' + f.name + '…');
  try {
    if (state.doc) api('/api/close', { method: 'POST', body: JSON.stringify({ id: state.doc }) }).catch(() => {});
    const j = await api('/api/upload', { method: 'POST', headers: { 'X-Filename': encodeURIComponent(f.name).replace(/%20/g, ' ') }, body: f });
    Object.assign(state, { doc: j.id, pages: j.pages, page: 0 });
    $('#fname').textContent = f.name;
    $('#pageCount').textContent = j.pages;
    $('#empty').hidden = true; $('#stage').hidden = false;
    await showPage(0, true);
    status(`Loaded ${j.pages} page${j.pages > 1 ? 's' : ''}. Drag over the table to select it.`);
  } catch (e) { status(e.message, true); }
  busy(false);
}

function showPage(n, fit = false) {
  n = Math.max(0, Math.min(state.pages - 1, n));
  state.page = n; clearSel();
  $('#pageNo').value = n + 1;
  const img = $('#pageImg');
  return new Promise(res => {
    img.onload = () => { state.natW = img.naturalWidth; if (fit) fitZoom(); else applyZoom(); res(); };
    img.onerror = () => { status('Could not render page', true); res(); };
    img.src = `/api/page?id=${state.doc}&n=${n}&dpi=150`;
    refreshButtons();
  });
}
function applyZoom() { $('#pageImg').style.width = Math.round(state.natW * state.zoom) + 'px'; $('#zoomLbl').textContent = Math.round(state.zoom * 100) + '%'; drawSel(); }
function fitZoom() { const w = $('#viewer').clientWidth - 24; state.zoom = Math.min(1.5, w / state.natW); applyZoom(); }
$('#zoomIn').onclick = () => { state.zoom = Math.min(4, state.zoom * 1.2); applyZoom(); };
$('#zoomOut').onclick = () => { state.zoom = Math.max(0.2, state.zoom / 1.2); applyZoom(); };
$('#fit').onclick = () => state.doc && fitZoom();
$('#prev').onclick = () => showPage(state.page - 1);
$('#next').onclick = () => showPage(state.page + 1);
$('#pageNo').onchange = e => { const n = parseInt(e.target.value, 10); if (n) showPage(n - 1); else e.target.value = state.page + 1; };
document.addEventListener('keydown', e => {
  if (!state.doc || e.target.closest('td, input, select, textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') showPage(state.page + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') showPage(state.page - 1);
});

$('#openBtn').onclick = () => $('#file').click();
$('#file').onchange = e => { openFile(e.target.files[0]); e.target.value = ''; };
const drop = $('#drop');
drop.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); drop.classList.add('over'); } });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); openFile(e.dataTransfer.files[0]); });

/* ---------- region selection (fractions of the page) ---------- */
const stage = $('#stage');
let dragStart = null;
function frac(e) {
  const r = $('#pageImg').getBoundingClientRect();
  return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
}
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  stage.setPointerCapture(e.pointerId);
  dragStart = frac(e); state.sel = [...dragStart, ...dragStart]; drawSel();
});
stage.addEventListener('pointermove', e => {
  if (!dragStart) return;
  const p = frac(e);
  state.sel = [Math.min(dragStart[0], p[0]), Math.min(dragStart[1], p[1]), Math.max(dragStart[0], p[0]), Math.max(dragStart[1], p[1])];
  drawSel();
});
stage.addEventListener('pointerup', () => {
  dragStart = null;
  if (state.sel && (state.sel[2] - state.sel[0] < 0.01 || state.sel[3] - state.sel[1] < 0.005)) clearSel();
  refreshButtons();
});
function drawSel() {
  const b = $('#selbox'), img = $('#pageImg');
  if (!state.sel) { b.style.display = 'none'; return; }
  const [x0, y0, x1, y1] = state.sel, w = img.clientWidth, h = img.clientHeight;
  Object.assign(b.style, { display: 'block', left: x0 * w + 'px', top: y0 * h + 'px', width: (x1 - x0) * w + 'px', height: (y1 - y0) * h + 'px' });
}
function clearSel() { state.sel = null; drawSel(); refreshButtons(); }
$('#clearSel').onclick = clearSel;

/* ---------- extraction ---------- */
$('#extract').onclick = async () => {
  if (!state.sel) return;
  const model = $('#model').value;
  busy(true); status(`Reading table with ${model}… (first run loads the model, may take a minute)`);
  try {
    const j = await api('/api/extract', { method: 'POST', body: JSON.stringify({ id: state.doc, page: state.page, rect: state.sel, model }) });
    if (!j.ok) { status(j.error, true); console.log('raw model output:', j.raw); }
    else {
      const append = document.querySelector('input[name=mode]:checked').value === 'append' && state.rows.length;
      let rows = j.rows;
      if (append) {
        // Skip a repeated header row when a table continues across pages.
        const same = (a, b) => a.length === b.length && a.every((c, i) => c.trim().toLowerCase() === (b[i] || '').trim().toLowerCase());
        if ($('#hasHeader').checked && same(rows[0], state.rows[0])) rows = rows.slice(1);
        state.rows = state.rows.concat(rows);
      } else state.rows = rows;
      squareUp(); renderGrid();
      status(`${append ? 'Appended' : 'Extracted'} ${rows.length} rows × ${state.rows[0].length} cols in ${j.seconds}s. Review and edit cells, then download.`);
    }
  } catch (e) { status(e.message, true); }
  busy(false);
};

/* ---------- editable grid ---------- */
function squareUp() {
  const w = Math.max(1, ...state.rows.map(r => r.length));
  state.rows = state.rows.map(r => r.concat(Array(w - r.length).fill('')));
}
function renderGrid() {
  const t = $('#grid'); t.innerHTML = '';
  const header = $('#hasHeader').checked;
  state.rows.forEach((row, r) => {
    const tr = t.insertRow();
    if (header && r === 0) tr.className = 'head';
    const rn = tr.insertCell(); rn.className = 'rn'; rn.textContent = r + 1;
    row.forEach((val, c) => {
      const td = tr.insertCell();
      td.contentEditable = 'plaintext-only';
      if (td.contentEditable !== 'plaintext-only') td.contentEditable = 'true';
      td.textContent = val; td.dataset.r = r; td.dataset.c = c;
    });
  });
  markCur(); refreshButtons();
}
const grid = $('#grid');
grid.addEventListener('input', e => { const td = e.target.closest('td[data-r]'); if (td) state.rows[td.dataset.r][td.dataset.c] = td.innerText.replace(/\n$/, ''); });
grid.addEventListener('pointerdown', e => { const td = e.target.closest('td[data-r]'); if (td) { state.cur = [+td.dataset.r, +td.dataset.c]; markCur(); } });
grid.addEventListener('focusin', e => { const td = e.target.closest('td[data-r]'); if (td) { state.cur = [+td.dataset.r, +td.dataset.c]; markCur(); } });
grid.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); });
grid.addEventListener('keydown', e => {
  const td = e.target.closest('td[data-r]'); if (!td) return;
  let [r, c] = [+td.dataset.r, +td.dataset.c];
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); r++; }
  else if (e.key === 'ArrowDown' && e.altKey) r++;
  else if (e.key === 'ArrowUp' && e.altKey) r--;
  else return;
  const next = grid.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
  if (next) { next.focus(); const s = getSelection(); s.selectAllChildren(next); s.collapseToEnd(); }
});
function markCur() {
  grid.querySelectorAll('td.cur').forEach(td => td.classList.remove('cur'));
  const [r, c] = state.cur;
  grid.querySelectorAll(`td[data-c="${c}"]`).forEach(td => td.classList.add('cur'));
  const rn = grid.rows[r] && grid.rows[r].cells[0]; if (rn) rn.classList.add('cur');
}
function ensureTable() { if (!state.rows.length) { state.rows = [['', '', ''], ['', '', '']]; state.cur = [0, 0]; } }
function clampCur() { state.cur = [Math.min(state.cur[0], state.rows.length - 1), Math.min(state.cur[1], (state.rows[0] || []).length - 1)].map(v => Math.max(0, v)); }
$('#addRow').onclick = () => { ensureTable(); const w = state.rows[0].length; state.rows.splice(state.cur[0] + 1, 0, Array(w).fill('')); state.cur[0]++; renderGrid(); };
$('#delRow').onclick = () => { state.rows.splice(state.cur[0], 1); if (!state.rows.length) state.rows = []; clampCur(); renderGrid(); };
$('#addCol').onclick = () => { ensureTable(); state.rows.forEach(r => r.splice(state.cur[1] + 1, 0, '')); state.cur[1]++; renderGrid(); };
$('#delCol').onclick = () => { state.rows.forEach(r => r.splice(state.cur[1], 1)); if (!state.rows[0].length) state.rows = []; clampCur(); renderGrid(); };
$('#hasHeader').onchange = renderGrid;

$('#copy').onclick = async () => {
  const tsv = [($('#title').value.trim() ? [$('#title').value.trim()] : []), ...state.rows]
    .filter(r => r.length).map(r => r.map(c => /[\t\n"]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c).join('\t')).join('\n');
  try { await navigator.clipboard.writeText(tsv); status('Copied — paste into Excel.'); } catch { status('Clipboard not available', true); }
};
$('#export').onclick = async () => {
  try {
    const title = $('#title').value;
    const r = await api('/api/export', { method: 'POST', body: JSON.stringify({ title, rows: state.rows, header: $('#hasHeader').checked }) });
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (title.trim().replace(/[\\/:*?"<>|]+/g, '_') || 'table') + '.xlsx';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    status('Saved ' + a.download);
  } catch (e) { status(e.message, true); }
};

/* ---------- translation ---------- */
const LANG_NAMES = { ur: 'Urdu', 'pa-Arab': 'Punjabi (Shahmukhi)', 'pa-Guru': 'Punjabi (Gurmukhi)', 'sd-Arab': 'Sindhi', en: 'English' };
async function translate(body, label) {
  const model = $('#tModel').value;
  busy(true); status(`${body.rect ? 'Reading and translating' : 'Translating'} ${label} with ${model}… (first run loads the model, may take a minute)`);
  try {
    const j = await api('/api/translate', { method: 'POST', body: JSON.stringify({ ...body, model, source: $('#srcLang').value, target: $('#tgtLang').value }) });
    const put = (el, text) => {  // selections can accumulate; typed text is always replaced
      const add = body.rect && $('#appendOut').checked && el.value.trim();
      el.value = add ? el.value.trimEnd() + '\n\n' + text : text;
      el.scrollTop = el.scrollHeight;
    };
    if (body.rect && j.original) put($('#srcText'), j.original);
    if (!j.ok) status(j.error, true);
    else {
      put($('#outText'), j.translation);
      const detected = $('#srcLang').value === 'auto' ? ` Detected ${LANG_NAMES[j.source]} — change “From” if that's wrong.` : '';
      const fix = body.rect ? ' Check the transcribed original; if it has errors, fix it and click “Translate text”.' : '';
      status(`Translated in ${j.seconds}s.${detected}${fix}`);
    }
  } catch (e) { status(e.message, true); }
  busy(false);
}
$('#translateText').onclick = () => translate({ text: $('#srcText').value }, 'text');
$('#translateSel').onclick = () => state.sel && translate({ id: state.doc, page: state.page, rect: state.sel }, `selection on page ${state.page + 1}`);
$('#srcText').addEventListener('input', refreshButtons);
$('#srcText').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#translateText').click(); });
$('#clearOut').onclick = () => { $('#outText').value = ''; };
$('#copyOut').onclick = async () => {
  try { await navigator.clipboard.writeText($('#outText').value); status('Translation copied.'); } catch { status('Clipboard not available', true); }
};
$('#saveOut').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + $('#outText').value], { type: 'text/plain;charset=utf-8' }));
  a.download = 'translation.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

function refreshButtons() {
  const has = !!state.doc;
  $('#translateSel').disabled = !has || !state.sel || state.busy;
  $('#translateText').disabled = !$('#srcText').value.trim() || state.busy;
  $('#prev').disabled = !has || state.page <= 0;
  $('#next').disabled = !has || state.page >= state.pages - 1;
  $('#extract').disabled = !has || !state.sel || state.busy;
  $('#clearSel').disabled = !state.sel;
  const rows = state.rows.length;
  $('#delRow').disabled = !rows; $('#delCol').disabled = !rows;
  $('#export').disabled = !rows; $('#copy').disabled = !rows;
}
window.addEventListener('resize', drawSel);
let savedTab = 'table';
try { savedTab = localStorage.getItem('tab') || 'table'; } catch {}
setTab(savedTab === 'translate' ? 'translate' : 'table');
loadModels().catch(e => status(e.message, true));
</script>
</body>
</html>
